  note: >-
    The deck is explicit in its own small print that the filing is not yet
    approved, which is to its credit. The registry keeps the distinction
    structural rather than parenthetical: this record contributes 100,000 to
    counts.filed and nothing to counts.licensed.

notes: >-
  Provenance gap: this record has no primary source. The file number,
  satellite count, altitude bands and spectrum all come from trade press. The
  application is public in ICFS and should be read; doing so would also settle
  whether the request is for a genuinely new system or an amendment of the
  Gen2 authorisation, which changes how the 100,000 should be aggregated.
