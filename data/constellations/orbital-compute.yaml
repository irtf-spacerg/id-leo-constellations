  code_note: >-
    Sun-synchronous circular orbits between 500 and 850 km. An altitude range,
    no inclination, no plane count, no per-plane population, and a local time
    of the ascending node that the code cannot express.
  src: fcc-orbital-pn-2026

spectrum:
- Ka
- optical
spectrum_detail: >-
  Ka-band 18.8-19.3 GHz (space-to-Earth) and 28.6-29.1 GHz (Earth-to-space)
  requested for back-up TT&C, per the accepted-for-filing notice. No service
  spectrum of its own.
isl: external
isl_detail: >-
  The system as described has no communications payload of its own for bulk
  data and relies on third-party optical relay through Starlink or Kuiper.
  Together with Starcloud and Blue Origin's Project Sunrise, that makes three
  separate orbital data centre proposals in this registry whose ground path
  depends on constellations they do not operate, none of which has published
  an interconnection interface.
