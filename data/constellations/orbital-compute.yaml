  scope: >-
    Application for a constellation of up to 100,000 satellites operating as a
    distributed data centre in space, in sun-synchronous circular orbits at
    altitudes between 500 km and 850 km, communicating with other commercial
    LEO systems over optical inter-satellite links. Back-up TT&C requested at
    18.8-19.3 GHz (space-to-Earth) and 28.6-29.1 GHz (Earth-to-space), with
    waivers of sections 25.156, 25.157, 25.164, 25.165 and 25.114(a)(1).
  src: fcc-orbital-pn-2026
