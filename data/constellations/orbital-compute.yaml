- field: counts.filed
  claim: '100,000 planned; 2027 demo mission, 2028 first full-scale satellite'
  claimed_by: york-ietf126
  registry_value: '100,000 requested 24 June 2026; application pending'
  note: >-
    Count agrees. Worth recording alongside it, because the registry's job is
    to make scale legible rather than to editorialise: 100,000 satellites at
    the stated 2 tonnes each is roughly 200,000 tonnes to orbit, from a
    company with reported pre-seed funding of USD 5 million and no launch
    vehicle of its own. Both facts are in the record; the reader can do the
    arithmetic.

notes: >-
  The filing anchor, date, count and orbits now rest on the FCC's
  accepted-for-filing notice. The design figures come from the operator's own
  release (orbital-release-2026): each satellite a single high-density rack
  of roughly eight servers, powered by about 100 kW from its own solar arrays,
  about 100 m across and about 2 tonnes, 10 GW of compute at full scale, a
  single-GPU demonstration payload on a Falcon 9 in 2027 and the first
  purpose-built satellite, Orbital-1, in 2028.
  The 8 July 2026 petition for a programmatic environmental review of orbital
  data centres does not name this application, which was accepted for filing
  three weeks later; the petition asks to cover similar projects filed after
  it.
  Provenance gap: the application narrative and technical attachments have
  not been read.
