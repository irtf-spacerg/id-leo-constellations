  date: 2026
  satellites: 100000
  scope: >-
    Application to deploy up to 100,000 satellites in low Earth orbit with a
    cumulative 10 GW of compute capacity. Each satellite is described as a
    high-density server rack of roughly 2 tonnes with a 100 kW solar array
    around 100 m across, in sun-synchronous orbit at 500-850 km, using passive
    radiative cooling.
  src: broadbandbreakfast-orbital-2026

shells:
- label: sso-500-850
  status: proposed
  geometry_kind: sso-band
  code_status: not-representable
  code_note: >-
    Sun-synchronous orbits between 500 and 850 km. An altitude range, no
    inclination, no plane count, no per-plane population, and a local time of
    the ascending node that the code cannot express.
  src: broadbandbreakfast-orbital-2026

isl: external
isl_detail: >-
  The system as described has no communications payload of its own for bulk
  data and relies on third-party optical relay through Starlink or Kuiper.
  Together with Starcloud and Blue Origin's Project Sunrise, that makes three
  separate orbital data centre proposals in this registry whose ground path
  depends on constellations they do not operate, none of which has published
  an interconnection interface.
