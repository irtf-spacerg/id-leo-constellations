regulatory:
- authority: FCC
  country: US
  kind: license-grant
  file_number: SAT-LOA-20210511-00064
  call_sign: S3087
  document: DA 22-969
  action: granted
  date: 2022-09-16
  satellites: 10
  scope: >-
    Order and Authorization granting, with conditions, ten satellites (Lynk
    Towers 1 through 10) under the streamlined small space station process of
    47 CFR 25.122. Service links in portions of 617-960 MHz (space-to-Earth)
    and 663-915 MHz (Earth-to-space) with earth stations outside the United
    States; feeder links and in-band TT&C at 20.1-20.2 GHz (space-to-Earth)
    and 29.9-30.0 GHz (Earth-to-space), contingent on Ka-band coordination;
    backup TT&C at 2200-2290 and 2025-2110 MHz contingent on coordination with
    federal systems. Resolved a petition to deny from Iridium and objections
    from Hughes, and comments from Inmarsat, Kuiper and NRAO.
  src: fcc-lynk-2022
- authority: FCC
  country: US
  kind: modification
  action: granted
  date: 2025-04-29
  scope: >-
    Modification permitting supplemental coverage from space in the
    845.1-845.3 MHz (Earth-to-space) and 890.1-890.3 MHz (space-to-Earth)
    bands in Guam and the Northern Mariana Islands, enabling commercial
    service with DOCOMO Pacific. Made Lynk the second direct-to-device
    provider licensed for commercial service in the United States.
  src: viasat-lynk-2025

spectrum:
