discrepancies:
- field: counts.licensed
  claim: '2,000 satellites planned'
  claimed_by: york-ietf126
  registry_value: '10 licensed; 2,000 announced with no filing found'
  note: >-
    A factor of 200 between the circulating figure and the authorisation. This
    is the sharpest illustration in the registry of why the columns must be
    kept apart: both numbers are true statements about different things, and
    putting them in one column labelled "planned" makes the smaller one
    disappear.
- field: counts.launched
  claim: '12 launched'
  claimed_by: york-ietf126
  registry_value: '12 launched against 10 authorised'
  note: >-
    Recorded as-is, with the inconsistency visible. Resolving it needs a check
    of Lynk's experimental and special temporary authority grants in ELS, which
    has not been done.

notes: >-
  Provenance gap: the April 2025 modification is recorded from trade press;
  the grant itself has not been retrieved, so it has no file number here.
  Provenance gap: the 12-launched figure exceeds the 10 authorised and the
  discrepancy has not been resolved against ELS records.
  Note for the group: DA 22-969 resolves a petition to deny from Iridium and
  comments from Kuiper and the NRAO. The direct-to-device band is contested by
  incumbents and radio astronomy, which is a spectrum-governance thread worth
  following in its own right.
