  planes: 401
  satellites: 6221
  code_status: not-representable
  code_note: >-
    401 orbital planes at 680, 800, 1000, 1400 and 1414 km, at inclinations
    stepped every two degrees from 60 to 90 plus sun-synchronous cases at
    98.1, 98.5, 99.4 and 101.4 degrees, mostly 16 satellites per plane with a
    few carrying 4 or 1. A single notice covering five altitudes and more than
    twenty inclinations is not one Walker constellation and cannot be reduced
    to a (T, P, F) triple. Note also that the 1400 and 1414 km groups are
    above the LEO band this registry is mostly concerned with.
