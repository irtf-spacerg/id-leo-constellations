discrepancies:
- field: counts
  claim: '1,946 satellites (C-3)'
  claimed_by: york-ietf126
  registry_value: >-
    48 satellites as the FCC describes the system; 6,221 declared in the ITU
    notification that backs it
  note: >-
    Three numbers for one system, all now documented. The FCC, in a public
    notice issued six weeks before the talk, calls this "the Globalstar C-3
    MSS system of 48 NGSO satellites, licensed by the Republic of France ...
    pursuant to its AST-NG-C-3 filing at the ITU". Read the AST-NG-C-3 filing
    and it declares 6,221 satellites across 401 planes. So the same instrument
    supports a 48-satellite operational plan and a 6,221-satellite
    international declaration, a ratio of about 130 to 1. The slide's 1,946
    matches neither and its origin is still unknown.
    This record is the registry's cleanest measurement of a general effect:
    ITU declarations are envelopes staked out for coordination priority, and
    reading them as deployment intentions overstates by orders of magnitude.
    Any aggregate that sums ITU-declared figures alongside nationally
    licensed ones is adding numbers that do not mean the same thing.

notes: >-
  Globalstar's operational second-generation service is a separate system and
  has its own record, globalstar-hibleo. The deck's "97 launched" and
  "~85 planned" belong there, not here.
  This record is also the registry's worked example of the
  flag-of-convenience pattern: a US operator's constellation licensed by a
  European administration and reaching the US market through a declaratory
  ruling rather than a licence. It is why `country` and `jurisdiction` are
  separate fields.
  Provenance gap: the French authorisation has not been retrieved, so the
  48-satellite figure rests on the FCC's description of it rather than on the
  French decision itself.
