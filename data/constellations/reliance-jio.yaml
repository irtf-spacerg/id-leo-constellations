status_detail: >-
  IN-SPACe approved the proposal on 17 July 2026, four days before the IETF
  126 session, judging it technically sound. The approval enables the
  Government of India to support the ITU filings and orbital rights the system
  needs; those filings are not yet made. Nothing launched.
