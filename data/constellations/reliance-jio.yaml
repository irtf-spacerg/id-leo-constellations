notes: >-
  Provenance gap: no primary source and no citable docket. IN-SPACe
  authorisations are not published in a form comparable to FCC ICFS.
  Carlos Martinez-Cagnazzo asked at IETF 126 who the proper authority is when
  a company files, and Dan York used exactly this system as the example: the
  Indian space agency approves, then the filing goes to the ITU. This record
  captures that chain at the moment the first step completed and the second
  had not yet begun, which makes it a useful teaching case for the draft.
