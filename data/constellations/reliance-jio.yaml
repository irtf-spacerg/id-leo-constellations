  satellites: 1600
  scope: >-
    Approval of Jio Platforms' proposal for a sovereign LEO constellation of
    more than 1,600 satellites, assessed as technically sound and comparable
    to Starlink and Kuiper. Reported throughput target of 4.5-5 Tbps against
    Starlink's approved 600 Gbps and Kuiper's proposed 3 Tbps in India. The
    approval enables Government of India support for the associated ITU
    filings and orbital rights coordination.
