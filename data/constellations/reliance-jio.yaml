    IN-SPACe authorisation of the Jio Platforms LEO constellation proposal,
    17 July 2026 (docket identifier not retrieved)
  src: businessstandard-jio-2026
  note: >-
    IN-SPACe does not publish authorisations in a searchable public docket, so
    the approval is known only through reporting. The ITU filings that would
    give the system a citable international identity are still to be made,
    with government support, which is part of what the approval grants.

