shells:
- label: declared-3660-planes
  status: proposed
  geometry_kind: irregular
  planes: 3660
  satellites: 96714
  code_status: not-representable
  code_note: >-
    3,660 orbital planes in one notice, spanning altitudes from 300 km to
    1,280 km and inclinations from 21 to 98.7 degrees. Most planes carry 30
    satellites; the 300 km / 88 degree group carries 79. This is not a
    constellation in the sense the code models: it is a filing that blankets
    the LEO shell space. 96,714 is not divisible by 3,660, and no single
    (T, P, F) triple could describe it even if it were.
  src: itu-ific-3067

