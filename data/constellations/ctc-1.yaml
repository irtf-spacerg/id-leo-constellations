status_detail: >-
  Advance publication information received by the ITU on 29 December 2025 and
  published on 17 March 2026. API/A is the earliest and weakest stage of the
  ITU process: it precedes the coordination request and confers no
  coordination priority. Nothing launched and no deployment programme
  identified.
