discrepancies:
- field: counts.filed
  claim: '96,714 satellites planned'
  claimed_by: york-ietf126
  registry_value: '96,714 declared in API/A 14285'
  note: >-
    No longer a discrepancy: the deck's figure is exactly right, and this
    registry can now say so from the ITU publication rather than take it on
    trust. Retained as an entry because the deck marked the source as "no
    confirmed official site", and the point of recording it is that the number
    has since been confirmed. What the deck's "planned" column still cannot
    convey is the stage: this is advance publication information, the first
    and weakest of the three ITU steps.

notes: >-
  Upgraded from secondary to primary on 2026-07-29 by querying the ITU Space
  Network List for the filing identity and then reading the declared orbit
  data out of BR IFIC 3067 directly. See scripts/itu_query.sh, which
  reproduces both steps.
  CTC-1 and CTC-2 together account for about 193,000 of the roughly 200,000
  satellites in the December 2025 Chinese filing wave, and therefore for a
  large share of any global aggregate. A reader deciding how much weight to
  put on a 2.3 million total should know that roughly 8 per cent of it comes
  from two filings by a single research institute, with a stated purpose that
  nobody has confirmed. Making that visible is the point of keeping the
  record.
