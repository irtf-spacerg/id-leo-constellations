notes: >-
  Found by scanning the non-GSO tables of the downloaded BR IFICs for Chinese
  networks with large plane counts, while looking for something else. It
  appears in no secondary source consulted for this registry and was not in
  the IETF 126 survey. A 2,664-satellite filing by the largest mobile operator
  in the world is not a marginal entry, and the fact that it surfaced only by
  reading the ITU publication directly is the clearest argument this registry
  has for doing so routinely.
  The 251 km shell is worth attention on its own: 960 satellites in 960
  separate planes at an altitude where drag is severe. Whether that is a
  serious deployment plan or a spectrum placeholder is exactly the question
  the API/A stage cannot answer.
