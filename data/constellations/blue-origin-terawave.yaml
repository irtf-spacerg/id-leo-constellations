    src: spacenews-blue-sunrise-2026
    note: >-
      Reported alongside the Project Sunrise filing. The IETF 126 deck gives
      5,348, with a breakdown of 5,310 LEO and 128 MEO that sums to 5,438.
      Three mutually inconsistent figures; see discrepancies.

shells:
- label: leo-meo
  status: proposed
  geometry_kind: unknown
  code_status: unknown
  code_note: >-
    Multi-orbit, with a LEO majority and a small MEO component. No altitudes,
    inclinations or plane structure traced.
  src: spacenews-blue-sunrise-2026

isl: optical
isl_detail: >-
  Optical downlinks reported to provide up to 6 Tbps. TeraWave is the intended
  optical backbone for Blue Origin's Project Sunrise orbital data centres,
  which makes the two systems a coupled pair: Sunrise has no independent path
  to the ground.

