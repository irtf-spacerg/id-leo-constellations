spectrum_detail: >-
  Per the accepted-for-filing notice: 37.5-42.0 GHz and 71-76 GHz
  (space-to-Earth); 47.2-50.2 GHz, 50.4-51.4 GHz and 81-86 GHz
  (Earth-to-space); 18.8-19.3 GHz (space-to-Earth) and 28.6-29.1 GHz
  (Earth-to-space); 2200-2290 MHz (space-to-Earth) and 2025-2110 MHz
  (Earth-to-space). Trade press reports Q/V-band for user links and E-band
  for gateways.
isl: optical
isl_detail: >-
  Optical downlinks reported to provide up to 6 Tbps. TeraWave is the intended
  optical backbone for Blue Origin's Project Sunrise orbital data centres,
  which makes the two systems a coupled pair: Sunrise has no independent path
  to the ground.

