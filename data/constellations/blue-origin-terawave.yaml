system_class: broadband
status: announced
status_detail: >-
  Announced January 2026, with deployment stated to begin Q4 2027. No FCC file
  number has been retrieved for TeraWave itself, though it is referred to in
  the Project Sunrise filing as the optical backbone that system depends on.
status_asof: 2026-07
services:
- broadband
- backhaul
orbit_regimes:
- LEO
- MEO
dual_use: civil

filing_absent: >-
  No filing reference retrieved. TeraWave is described in trade press as an
  announced constellation and is referenced in Blue Origin's Project Sunrise
  FCC application as the communications network Sunrise will relay through,
  but no application or grant for TeraWave itself has been located in this
  pass. It may well exist; this is a gap in our work, not a statement that
  none exists.

counts:
  announced:
    value: 5408
