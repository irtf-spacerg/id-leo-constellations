discrepancies:
- field: counts.announced
  claim: '5,348 total; 5,310 LEO; 128 MEO'
  claimed_by: york-ietf126
  registry_value: '5,408 announced (also disputed)'
  note: >-
    The deck's own figures do not reconcile: 5,310 + 128 = 5,438, not 5,348.
    Trade press reporting the Sunrise filing gives 5,408. Three numbers, no
    filing, no way to choose between them. Recorded as 5,408 only because that
    figure appears in reporting tied to a document, and flagged here so the
    uncertainty is visible rather than averaged away.

notes: >-
  Provenance gap: no primary source and no filing reference. Everything here
  is trade press and a conference slide, and the headline count is disputed
  three ways. Locating a TeraWave application in ICFS would fix all of it.
  Recorded despite that because Project Sunrise, which does have a filing,
  depends on TeraWave for its ground path. A registry that carried Sunrise but
  not TeraWave would hide the dependency.
