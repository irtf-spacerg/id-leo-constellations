discrepancies:
- field: counts.filed
  claim: '5,348 total; 5,310 LEO; 128 MEO'
  claimed_by: york-ietf126
  registry_value: '5,408 filed (5,280 LEO and 128 MEO), as reported with the filing'
  note: >-
    The deck's own figures do not reconcile: 5,310 + 128 = 5,438, not 5,348.
    Satellite Today's report of the January 2026 application gives 5,280 LEO
    and 128 MEO, which sums to 5,408 and agrees with the SpaceNews figure
    (spacenews-blue-sunrise-2026). The FCC notice states no count, so the
    application itself remains the tie-breaker.

notes: >-
  Until October 2026 this record carried `filing_absent:` because no
  application had been located. The application is SAT-LOA-20260120-00033,
  call sign S00788, accepted for filing on 27 February 2026, so the record
  now anchors on it and sits on the pending-application rung.
  Provenance gap: the application narrative and Schedule S have not been read.
  The satellite count and the LEO/MEO split rest on trade press, and the shell
  structure is untraced. Third-party mirrors of ICFS show a September 2026
  amendment, SAT-AMD-20260905-00360, which has not been read.
