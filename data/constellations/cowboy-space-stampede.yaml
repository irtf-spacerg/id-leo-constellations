notes: >-
  Count, orbits, licensee name, file number and call sign now rest on the
  FCC's accepted-for-filing notice. The ICFS file number carries the date
  23 March 2026, seven weeks before the date filed; the notice gives 11 May
  2026, which is the date used here. The former company name, Aetherflux, is
  stated in the overview deck attached to the applicant's June 2026 ex parte
  notice (cowboy-exparte-2026).
  Provenance gap: the application itself has not been read. The statements
  that the design is unfinished, that a modification will be needed before
  service, and that launches begin in 2028 rest on SpaceNews.
  This record is worth keeping in view for a reason beyond its size. The
  company is reported to have told the regulator that the satellite design is
  unfinished and that a modification will be needed before service. That is a
  filing made to hold a place in a processing round, stated as such, by the
  applicant. It is the cleanest documented instance in this registry of the
  mechanism Dan York and Nitinder Mohan discussed at IETF 126: filings as
  spectrum positioning rather than deployment commitments. Recording it as
  `filed` and never as `licensed` is exactly the distinction the registry
  exists to preserve.
