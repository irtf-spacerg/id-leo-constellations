notes: >-
  Provenance gap: no primary source and no file number.
  This record is worth keeping in view for a reason beyond its size. The
  company told the regulator that the satellite design is unfinished and that
  a modification will be needed before service. That is a filing made to hold
  a place in a processing round, stated as such, by the applicant. It is the
  cleanest documented instance in this registry of the mechanism Dan York and
  Nitinder Mohan discussed at IETF 126: filings as spectrum positioning rather
  than deployment commitments. Recording it as `filed` and never as
  `licensed` is exactly the distinction the registry exists to preserve.
