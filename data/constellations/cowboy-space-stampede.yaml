  scope: >-
    Application for up to 20,000 orbital data centre satellites in dawn-dusk
    sun-synchronous orbits in shells between 700 and 1,000 km. The application
    provides few details because the satellite design is not finished, and
    states that a licence modification will be required before service.
    Launches are said to begin in 2028.
  src: spacenews-cowboy-2026

shells:
- label: dawn-dusk-700-1000
  status: proposed
  geometry_kind: sso-band
  code_status: not-representable
  code_note: >-
    Dawn-dusk sun-synchronous shells between 700 and 1,000 km. Altitude range,
    no plane structure, and a local time of the ascending node with no
    representation in the code. The dawn-dusk choice is the whole point of the
    design, since it maximises solar exposure, and it is precisely the
    parameter the notation cannot carry.
  src: spacenews-cowboy-2026

