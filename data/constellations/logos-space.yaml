discrepancies:
- field: counts.licensed
  claim: '3,960 satellites authorised'
  claimed_by: satnews-logos-2026
  registry_value: '4,178 recorded, disputed'
  note: >-
    Two trade outlets reporting the same partial grant within a week give
    4,178 and 3,960. The gap of 218 is consistent with a partial grant in
    which some satellites were deferred alongside the deferred spectrum, in
    which case 3,960 would be the licensed figure and 4,178 the filed one.
    That is a hypothesis, not a finding. Because the registry cannot tell
    which is which without the order, both counts currently carry 4,178 and
    this note carries the doubt. Reading the order resolves it immediately.
- field: counts.licensed
  claim: '4,178 planned, FCC-approved'
  claimed_by: york-ietf126
  registry_value: '4,178, partial grant with deferrals and denials'
  note: >-
    The count matches. What the deck's "FCC-approved" does not convey is that
    the grant is partial: parts of the spectrum request were deferred and
    parts denied.

notes: >-
  Provenance gap: this record has no primary source. The FCC order granting in
  part was not located at docs.fcc.gov during this pass, so the DA number is
  unknown and the satellite count is unresolved between two secondary reports
  that disagree. Reading the order would fix the count, the shells, the
  spectrum ranges and the milestone in one go. This is the highest-value
  outstanding lookup in the registry.
