spectrum_detail: >-
  S-, Ka-, V- and E-band per the grant. A processing-round waiver additionally
  covers 21.2-23.55, 25.5-27.0, 37.5-40.0, 40.0-42.0, 42.0-42.5, 47.0-47.2,
  47.2-50.2 and 50.4-51.4 GHz, conditioned on participation in a future
  processing round.
isl: rf-planned
isl_detail: >-
  Inter-satellite service is part of what was applied for, alongside in-space
  data relay to satellites in lower orbits, which makes this system a
  potential backhaul provider for orbital data centres rather than only a
  broadband operator.

