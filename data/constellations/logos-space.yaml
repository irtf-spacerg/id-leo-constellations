regulatory:
- authority: FCC
  country: US
  kind: application
  file_number: SAT-LOA-20241030-00243
  action: pending
  date: 2024-10-30
  satellites: 4178
  scope: >-
    Application to construct, deploy and operate up to 4,178 NGSO satellites
    in low Earth orbit across multiple orbital shells, providing fixed
    satellite, inter-satellite and standard frequency and time signal-satellite
    (SFTS) service to enterprise and government customers, plus in-space data
    relay to satellite networks in lower orbits.
  src: spacenews-logos-2026
- authority: FCC
  country: US
  kind: license-grant
  file_number: SAT-LOA-20241030-00243 and SAT-AMD-20250328-00084
  action: granted
  date: 2026-01-30
  satellites: 4178
  scope: >-
    Authority to launch and operate 4,178 satellites in certain S-, Ka-, V-
    and E-band frequencies, plus a waiver of the processing round rules for
    the 21.2-23.55, 25.5-27.0, 37.5-40.0, 40.0-42.0, 42.0-42.5, 47.0-47.2,
    47.2-50.2 and 50.4-51.4 GHz bands. The waiver is conditioned on Logos
    participating in a future processing round for those bands, and the
    Bureau included Logos in the third processing round it opened in June
    2026.
