discrepancies:
- field: counts.licensed
  claim: '3,960 satellites authorised'
  claimed_by: satnews-logos-2026
  registry_value: '4,178 authorised'
  note: >-
    Resolved against the FCC. Two trade outlets reported the same grant within
    a week as 4,178 and 3,960; the Space Bureau's own subsequent order says
    4,178. The earlier guess in this registry, that 3,960 might be a licensed
    figure against a 4,178 request, was wrong: the grant is for the full
    number applied for. A good argument for reading the order rather than
    reasoning about which secondary source looks more plausible.
- field: counts.licensed
  claim: '4,178 planned, FCC-approved'
  claimed_by: york-ietf126
  registry_value: '4,178 authorised 30 January 2026'
  note: >-
    Correct on both count and status. One of the cleanest entries in the deck.

notes: >-
  Provenance upgraded 2026-07-29. The grant stamp itself is not a published
  document with a DA number, but the Space Bureau restates its terms in
  DA 26-552, which is citable and is used here.
  Provenance gap: the orbital shells are still unknown. The grant stamp and
  the underlying application would give them.
