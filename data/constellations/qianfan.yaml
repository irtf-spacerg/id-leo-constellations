filing_absent: >-
  No filing reference established, and not for want of looking. The ITU Space
  Network List was queried on 2026-07-29 for QIANFAN, SSST, SPACESAIL,
  STARNET, THOUSANDSAILS, G60-STARLINK, CHINA-LEO, CHINASAT-LEO, SSST-GW,
  QIANFAN-1 and QF-1, all returning nothing; the SNL name search is exact, not
  substring, so a name we have not guessed will not surface. Scanning the
  non-GSO tables of six downloaded BR IFICs for Chinese networks turned up 100
  or so names, none obviously this system. A filing almost certainly exists
  under a designation we do not know. China's national authorisations are
  separately not published in any docket comparable to the FCC's ICFS.

