itu:
- administration: CHN
  stage: API
  date: 2025-12
  src: spacenews-china-itu-2026
  note: >-
    NOT CONFIRMED for this system. China filed with the ITU in late 2025 for
    frequency and orbital resources covering on the order of 200,000
    satellites across roughly 14 constellations, and this registry has now
    identified four of those networks by name (CTC-1, CTC-2, CHINAMOBILE-L1
    and CHINAMOBILE-M1). None of them is Qianfan. This entry records the
    existence of the wave, not a Qianfan filing identity, and should be
    deleted or replaced once the real network name is known.

