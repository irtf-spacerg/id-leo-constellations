notes: >-
  Provenance gap: this record has no primary source at all, and that is the
  point of keeping it in this state rather than filling the fields from press
  coverage. The primary sources that would fix it are (a) the ITU SNS/SRS
  records for the Chinese administration's filings covering this system, and
  (b) any MIIT authorisation document. Neither has been consulted.
  This record is the registry's worked example of the non-US jurisdiction
  problem: for FCC-licensed systems the filing, the geometry, the milestones
  and the spectrum are all in a public docket, and for most others they are
  not. Any aggregate satellite count that treats a Chinese or Russian figure
  as equivalent evidence to an FCC grant is comparing unlike things, and the
  registry should make that visible rather than smooth it over.
