notes: >-
  Provenance gap: this record still has no primary source, and after a
  systematic ITU search it is now the only major system in the registry in
  that position. See filing_absent for what was tried. The most likely routes
  in are: a Chinese-language source that gives the ITU designation directly; a
  full SNL export filtered by administration, which the ITU server currently
  returns a 500 for on date-range queries; or somebody in the group with
  access to the BR IFIC DVD-ROM, which would allow scanning publications
  outside the eighteen-month download window when the filing was most likely
  made.
  ASK THE LIST. This is a good first question to put to space@irtf.org once
  the registry is announced: a working constellation of 239 satellites whose
  ITU identity we cannot find is exactly the kind of gap a group is better at
  closing than an individual.
  This record is the registry's worked example of the non-US jurisdiction
  problem: for FCC-licensed systems the filing, the geometry, the milestones
  and the spectrum are all in a public docket, and for most others they are
  not. Any aggregate satellite count that treats a Chinese or Russian figure
  as equivalent evidence to an FCC grant is comparing unlike things, and the
  registry should make that visible rather than smooth it over.
