system_class: broadband
status: deploying
status_detail: >-
  Launching production satellites since August 2024; regional service targeted
  for around 2026 and global service around 2030. Well short of the announced
  phase targets.
status_asof: 2026-07
services:
- broadband
orbit_regimes:
- LEO
dual_use: unknown

filing_absent: >-
  No filing reference has been established for this system. China's national
  authorisations are not published in a public docket comparable to the FCC's
  ICFS, and the ITU SNS records for the Chinese administration's filings have
  not been searched for a network matching this constellation. Unlike
  starshield, this is a gap in our work rather than a structural limit: a
  filing very probably exists and can be found.

counts:
  launched:
    value: 239
    asof: 2026-07
    src: york-ietf126
  announced:
    value: 15000
    asof: 2026-07
    src: wikipedia-qianfan
    note: >-
      Company build-out target of roughly 15,000 satellites by 2030, in phases
      of 648 (regional), 1,296 (global) and the remainder. The IETF 126 slide
      gives 16,000; both figures circulate. No filing has been consulted that
      substantiates either, so this sits under announced rather than filed.

itu:
- administration: CHN
  stage: API
  date: 2025-12
  src: spacenews-china-itu-2026
  note: >-
    NOT CONFIRMED for this system specifically. China filed with the ITU in
    late 2025 for frequency and orbital resources covering on the order of
    200,000 satellites across roughly 14 constellations. Whether and how much
    of that filing set covers Qianfan has not been checked against the ITU SNS
    database. This entry records the existence of the filing wave, not a
    Qianfan filing identity.

