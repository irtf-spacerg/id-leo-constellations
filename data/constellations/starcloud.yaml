status_detail: >-
  One demonstrator on orbit (Starcloud-1, November 2025). The 88,000-satellite
  system is an FCC application filed 4 February 2026 and accepted for filing
  13 March 2026; no grant. A July 2026 petition asks the FCC to pause all
  orbital data centre licensing.
