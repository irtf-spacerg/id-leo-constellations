discrepancies:
- field: counts.filed
  claim: '88,000 satellites planned'
  claimed_by: york-ietf126
  registry_value: '88,000 requested; application pending, no grant'
  note: >-
    The figure agrees with the application as reported. The disagreement is
    about the axis, not the number: an accepted-for-filing application
    establishes a place in a processing round, not an authorisation. This
    record therefore contributes 88,000 to counts.filed and nothing to
    counts.licensed.

notes: >-
  Provenance gap: this record has no primary source. Everything except the
  demonstrator launch rests on one trade-press report of the FCC application.
  The application itself (ICFS SAT-LOA-20260202-00073) is public and should be
  read; the accepted-for-filing public notice would also be a primary source
  for the date. Until then every number here is secondary and the record
  should be read as such.
  Kept in the registry despite the weak provenance because orbital data centre
  filings are a large and fast-growing share of the aggregate satellite count,
  and because this system as filed depends entirely on other operators'
  optical crosslinks - which is exactly the kind of coupling the group should
  be able to see.
