regulatory:
- authority: FCC
  country: US
  kind: application
  file_number: SAT-LOA-20260202-00073
  call_sign: S00803
  action: pending
  date: 2026-02-04
  satellites: 88000
  scope: >-
    Application for a constellation of up to 88,000 satellites operating as a
    distributed data centre in space, in sun-synchronous orbit at altitudes
    between 600 km and 850 km, communicating with other commercial LEO
    systems over optical inter-satellite links. Back-up TT&C requested at
    18.8-19.3 GHz (space-to-Earth) and 28.6-29.1 GHz (Earth-to-space), with
    waivers of sections 25.156, 25.157, 25.164, 25.165 and 25.114(a)(1).
  src: fcc-starcloud-pn-2026
- authority: FCC
  country: US
  kind: public-notice
  file_number: SAT-LOA-20260202-00073
  document: Report No. SAT-01982
  action: pending
  date: 2026-03-13
  scope: Space Bureau accepts the application for filing.
  src: fcc-starcloud-pn-2026
- authority: FCC
  country: US
  kind: petition
  file_number: SAT-LOA-20260202-00073
  action: pending
  date: 2026-07-08
  scope: >-
    DarkSky International, Environment America and PEER petition the FCC to
    prepare a programmatic environmental impact statement under NEPA covering
    all pending orbital data centre applications (SpaceX, Starcloud, Blue
    Origin, Cowboy Space), and to pause licensing until it is complete. In the
    alternative the petition asks to be treated as a petition to deny each
    application under 47 CFR 1.1313(a).
  src: darksky-peis-petition-2026

shells:
- label: proposed-sso-band
  status: proposed
  geometry_kind: sso-band
  code_status: not-representable
  code_note: >-
    The application describes a *band* of dusk-dawn sun-synchronous shells
    between 600 and 850 km, each up to 50 km thick, without a stated plane
    count, satellites-per-plane or phasing. Sun-synchronous orbits also
    require an altitude-dependent inclination that the code carries but does
    not constrain, and the local-time-of-ascending-node that makes an orbit
    "dusk-dawn" has no representation in the code at all. Nothing here is
    expressible as a Walker triple.
  src: spacenews-starcloud-2026

spectrum:
- Ka
- optical
spectrum_detail: >-
  Ka-band 18.8-19.3 GHz (space-to-Earth) and 28.6-29.1 GHz (Earth-to-space)
  requested for back-up TT&C, per the accepted-for-filing notice; trade press
  reports it as on a non-interference basis. No service spectrum of its own:
  user data is to move over optical inter-satellite links to Starlink, Amazon
  Leo and Blue Origin TeraWave.
isl: optical
isl_detail: >-
  External dependency. The system as filed has no independent path to the
  ground for bulk data and relies on crosslinks into constellations operated
  by other companies, none of which has published an interconnection
  interface. This is a governance and interoperability question for the group
  as much as a technical one.

