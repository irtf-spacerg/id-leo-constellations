discrepancies:
- field: counts.filed
  claim: '88,000 satellites planned'
  claimed_by: york-ietf126
  registry_value: '88,000 requested; application pending, no grant'
  note: >-
    The figure agrees with the FCC's accepted-for-filing notice. The
    disagreement is
    about the axis, not the number: an accepted-for-filing application
    establishes a place in a processing round, not an authorisation. This
    record therefore contributes 88,000 to counts.filed and nothing to
    counts.licensed.

notes: >-
  The filing anchor, call sign, filing date and requested count now rest on
  the FCC's accepted-for-filing notice. The notice gives 4 February 2026 as the
  date filed, two days after the date carried in the file number.
  Provenance gap: the application itself (ICFS SAT-LOA-20260202-00073) has not
  been read. The shell description (narrow shells up to 50 km thick, dusk-dawn
  local time) and the demonstrator launch still rest on trade press.
  Orbital data centre filings are a large and fast-growing share of the
  aggregate satellite count, and this system as filed depends entirely on
  other operators' optical crosslinks, which is exactly the kind of coupling
  the group should be able to see.
