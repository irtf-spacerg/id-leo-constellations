discrepancies:
- field: counts.filed
  claim: '1,190 satellites planned'
  claimed_by: york-ietf126
  registry_value: 'about 1,200 requested'
  note: >-
    The deck's 1,190 is more precise than anything this registry can source
    and is very likely the exact figure in the application. Recorded as a
    discrepancy not because the deck is wrong but because the registry cannot
    yet confirm it, and adopting a precise unsourced number would be exactly
    the laundering the grading rules exist to prevent. Reading the application
    would let 1,190 replace "about 1,200" with a primary source behind it.

notes: >-
  Provenance gap: no primary source, no file number, no filing date.
  Worth noting for anyone modelling this system: repeating ground tracks are
  unusual among the constellations in this registry and change the contact
  pattern seen by a fixed ground station substantially. It is a good test case
  for the ground-station elements added in
  draft-piraux-space-constellation-code-02.
