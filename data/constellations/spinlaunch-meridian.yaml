regulatory:
- authority: FCC
  country: US
  kind: application
  action: pending
  satellites: 1200
  scope: >-
    Application to deploy about 1,200 satellites operating in Ka-, Ku- and
    V-band, at 830 km in an arrangement giving fixed ground tracks rather than
    precessing ones, so that ground equipment need track in only one
    dimension. Enterprise and government market rather than consumer.
  src: spacenews-spinlaunch-2025

shells:
- label: repeating-ground-track-830
  status: proposed
  geometry_kind: irregular
  altitude_km: 830
  code_status: not-representable
  code_note: >-
    A repeating-ground-track constellation, chosen so that satellite passes
    recur over fixed points and ground antennas can track in one dimension.
    The code can express the altitude but has no way to state that the orbits
    are selected for ground-track repetition, which is the design's defining
    property and constrains altitude and inclination jointly. Plane count and
    per-plane population not published.
  src: spacenews-spinlaunch-2025

