discrepancies:
- field: shells
  claim: 'OneWeb: S:1200:87.9:672/12/11'
  claimed_by: piraux-code-draft
  registry_value: >-
    588 satellites in 12 planes at 87.9 deg plus 128 in 8 planes at 55 deg
    (authorised 2023); previously 720 in 18 planes at 87.9 deg (2017)
  note: >-
    The constellation-code draft's own example table does not match either
    authorised configuration. Its 672/12 has the right plane count for the
    current polar group but the wrong satellite count (672 against 588), and
    it omits the 55 degree inclined group entirely. Worth correcting in the
    draft, and a useful illustration of why examples in specifications need
    the same provenance discipline as registry entries.
- field: counts.filed
  claim: '660 launched; 528 (Next) planned'
  claimed_by: york-ietf126
  registry_value: '716 licensed; 6,372 requested and deferred'
  note: >-
    The deck's 660 launched is consistent. Its "528 (Next)" refers to Eutelsat
    Next, an announced successor system that needs its own record and does not
    yet have one. What neither the deck nor most coverage mentions is the
    deferred request for 6,372 satellites, which is nearly nine times the
    authorised constellation and is the single largest unremarked number found
    in this pass.

notes: >-
  Provenance gap: the UK authorisation held by WorldVu Satellites Limited has
  not been retrieved, so the licensed figure recorded here is strictly the
  number for which US market access is granted.
  Eutelsat Next, the announced successor constellation, is not recorded and
  needs its own record once a filing or a firm figure can be traced.
