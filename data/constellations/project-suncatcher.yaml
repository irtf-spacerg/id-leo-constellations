discrepancies:
- field: counts
  claim: '? satellites planned; 2027 prototype?'
  claimed_by: york-ietf126
  registry_value: >-
    No constellation count; one prototype launched 1 October 2026, two
    satellites planned for 2027
  note: >-
    The deck records the count as a question mark, which is right. This
    registry does the same by recording no constellation figure rather than
    writing zero. The prototype flew earlier than the deck's 2027.

notes: >-
  Counts carry only the launched prototype. An announced programme from an
  operator of this size, with no stated constellation size, is a real
  category and the honest representation of it is absence. Writing a
  speculative number here would corrupt exactly the aggregate the registry is
  meant to make trustworthy. The `demonstrator` status places this record on
  the in-orbit rung with one satellite, which is all it has.
  Provenance gap: the FCC authority under which the prototype operates
  (presumably a Planet licence or modification) has not been identified, and
  the Google Research post describing the system design has been cited but
  not read in detail; it would give the cluster geometry and the power and
  thermal assumptions.
