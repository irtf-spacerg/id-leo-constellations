name: Project Suncatcher
slug: project-suncatcher
family: project-suncatcher
aka:
- Google Project Suncatcher
operator: Google LLC
parent: Alphabet Inc.
country: US
jurisdiction:
- US
system_class: orbital-compute
status: announced
status_detail: >-
  A research programme, announced November 2025, to put Google TPUs in orbit.
  Two prototype satellites are to be built and operated by Planet Labs for an
  in-orbit demonstration in early 2027. No constellation size has been stated
  and no filing has been identified.
status_asof: 2026-07
services:
- orbital-compute
orbit_regimes:
- LEO
dual_use: civil

filing_absent: >-
  No filing identified. The programme is presented as research with a
  two-satellite demonstration, and the demonstration satellites are to be
  built and operated by Planet Labs, so any near-term spectrum authority would
  most likely sit under Planet's existing licences rather than a new Google
  filing. There is nothing yet to file for: no constellation size has been
  announced.

shells:
- label: compute-cluster
  status: proposed
  geometry_kind: irregular
  code_status: not-representable
  code_note: >-
    The published concept is clusters of about 81 satellites flying in
    formation within arrays roughly 1 km across, linked optically. That is a
    formation-flying geometry, not an orbital shell: the parameter that
    matters is inter-satellite separation within a cluster, which the
    constellation code has no way to express at all. Of everything in this
    registry, this is the design furthest from what the notation was built
    for.
  src: dcd-suncatcher-2025

isl: optical
isl_detail: >-
  Optical inter-satellite links are central to the concept, used to distribute
  machine-learning workloads across a tightly spaced cluster. Validating them
  is one of the stated goals of the 2027 demonstration.

first_launch: 2027
target_completion_kind: operator-target
launch:
  providers:
  - Planet Labs
  cadence: Two prototype satellites planned for early 2027.
  src: dcd-suncatcher-2025

