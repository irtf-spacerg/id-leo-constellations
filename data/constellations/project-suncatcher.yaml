name: Project Suncatcher
slug: project-suncatcher
family: project-suncatcher
aka:
- Google Project Suncatcher
operator: Google LLC
parent: Alphabet Inc.
country: US
jurisdiction:
- US
system_class: orbital-compute
status: demonstrator
status_detail: >-
  A research programme, announced November 2025, to put Google TPUs in orbit.
  One prototype satellite, developed with Planet, launched on 1 October 2026
  on SpaceX Transporter-18 and was reported healthy and in calibration on
  20 October. A two-satellite optical-link test is planned for 2027. No
  constellation size has been stated and no filing has been identified.
status_asof: 2026-10
services:
- orbital-compute
orbit_regimes:
- LEO
dual_use: civil

filing_absent: >-
  No filing identified for a Suncatcher constellation, and there is nothing
  yet to file for: no constellation size has been announced. The prototype in
  orbit was developed with Planet Labs, so its spectrum authority most likely
  sits under Planet's licences rather than a new Google filing; that
  authorisation has not been identified (see notes).

counts:
  launched:
    value: 1
    asof: 2026-10-20
    src: planet-firstlight-2026
    note: >-
      The TPU prototype, launched 1 October 2026 on Transporter-18. It is a
      test article; no constellation satellite has flown.

shells:
- label: compute-cluster
  status: proposed
  geometry_kind: irregular
  code_status: not-representable
  code_note: >-
    The published concept is clusters of about 81 satellites flying in
    formation within arrays roughly 1 km across, linked optically. That is a
    formation-flying geometry, not an orbital shell: the parameter that
    matters is inter-satellite separation within a cluster, which the
    constellation code has no way to express at all. Of everything in this
    registry, this is the design furthest from what the notation was built
    for.
  src: dcd-suncatcher-2025

isl: optical
isl_detail: >-
  Optical inter-satellite links are central to the concept, used to distribute
  machine-learning workloads across a tightly spaced cluster. The 2026
  prototype tests TPUs only; validating the links is the goal of the
  two-satellite test planned for 2027.

first_launch: 2026-10-01
target_completion_kind: operator-target
launch:
