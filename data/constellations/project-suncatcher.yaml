discrepancies:
- field: counts
  claim: '? satellites planned; 2027 prototype?'
  claimed_by: york-ietf126
  registry_value: 'No count; two demonstration satellites in early 2027'
  note: >-
    The deck records the count as a question mark, which is right. This
    registry does the same by leaving `counts` empty rather than writing zero,
    and adds the one firm number available: two prototypes.

notes: >-
  Included with an empty `counts` block on purpose. An announced programme
  from an operator of this size, with no stated constellation size, is a real
  category and the honest representation of it is absence. Writing a
  speculative number here would corrupt exactly the aggregate the registry is
  meant to make trustworthy.
  Provenance gap: the Google Research post describing the system design has
  been cited but not read in detail; it would give the cluster geometry and
  the power and thermal assumptions.
