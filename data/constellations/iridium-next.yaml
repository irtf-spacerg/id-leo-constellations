shells:
- label: iridium-walker-star
  status: deployed
  geometry_kind: walker
  altitude_km: 780
  inclination_deg: 86.4
  planes: 6
  sats_per_plane: 11
  satellites: 66
  walker: S
  phasing: 1
  code: 'S:780:86.4:66/6/1'
  code_status: assumed-phasing
  code_assumptions:
  - element: phasing
    value: 1
    basis: >-
      Not taken from the FCC engineering statement, which has not been read in
      full. This is the value in the example table of
      draft-piraux-space-constellation-code.
    src: piraux-code-draft
  - element: altitude_km
    value: 780
    basis: >-
      From the constellation-code draft's example table, not from the filing.
      The operational altitude is well established in the literature but is
      recorded here as an assumption because the primary source consulted for
      this record does not state it.
    src: piraux-code-draft
  - element: inclination_deg
    value: 86.4
    basis: As above, from the constellation-code draft's example table.
    src: piraux-code-draft
  code_src: piraux-code-draft
  src: piraux-code-draft

spectrum:
- L
- Ka
spectrum_detail: >-
  L-band service links; Ka-band feeder links and crosslinks. Exact ranges not
  recorded; the engineering statement would give them.
isl: rf
isl_detail: >-
  Ka-band inter-satellite links, four per satellite, in the classic
  fore/aft/port/starboard arrangement of a Walker Star. Historically the only
  operational crosslinked commercial LEO constellation, and the reference
  design for much of the LEO routing literature.

