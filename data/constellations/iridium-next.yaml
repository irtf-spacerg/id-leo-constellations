  authority: FCC
  administration: USA
  file_number: SAT-MOD-20131227-00148
  call_sign: S2110
  src: fcc-iridium-next-eng

counts:
  licensed:
    value: 81
    asof: 2013-12-27
    src: fcc-iridium-next-eng
    breakdown:
    - {label: 'Replacement satellites', value: 66, src: fcc-iridium-next-eng}
    - {label: 'In-orbit spares (one per plane)', value: 6,
       src: fcc-iridium-next-eng}
    - {label: 'Ground spares', value: 9, src: fcc-iridium-next-eng}
    note: >-
      The modification requests authority for up to 66 second-generation
      replacement satellites, with six in-orbit spares deployed alongside them
      and nine held as ground spares. Whether the FCC counts the ground spares
      against the authorisation has not been checked, so 81 is the upper
      reading and 75 the number actually flown.
  launched:
    value: 75
    asof: 2019
    src: york-ietf126
    note: >-
      Iridium NEXT satellites launched. The deck's 177 is the cumulative
      figure across both generations since 1997 and belongs to a
      first-generation record that does not yet exist.
  filed:
    value: 81
    asof: 2013-12-27
    src: fcc-iridium-next-eng

regulatory:
- authority: FCC
  country: US
  kind: modification
  file_number: SAT-MOD-20131227-00148
  call_sign: S2110
  action: granted
  date: 2013
  satellites: 81
  scope: >-
    Modification of the Big LEO MSS licence to launch and operate up to 66
