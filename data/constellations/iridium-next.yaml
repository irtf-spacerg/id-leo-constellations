discrepancies:
- field: counts.launched
  claim: '75 planned / 177 launched'
  claimed_by: york-ietf126
  registry_value: '81 authorised / 75 Iridium NEXT satellites launched'
  note: >-
    The deck's two numbers belong to different systems: 75 is the NEXT
    constellation, 177 is the cumulative total since 1997 across both
    generations, most of which have re-entered. The slide is explicit about
    this in its footnote, which is more than most sources manage. The registry
    handles it structurally by scoping the record to one authorisation.

notes: >-
  Provenance gap: the shell geometry on this record is sourced entirely to the
  constellation-code draft, not to the filing. The Iridium NEXT engineering
  statement is public and would give the authorised altitude, inclination and
  plane structure directly; reading it would move three code_assumptions from
  assumed to exact. This is the clearest single provenance upgrade available
  in the registry right now.
  Project Stardust, Iridium's announced direct-to-device layer, has no
  authorisation identified and no satellite count and is therefore not
  recorded. The deck notes it as "plus unknown number".
