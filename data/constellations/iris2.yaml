    SpaceRISE 12-year concession contract with the European Commission, signed
    16 December 2024
  src: ses-iris2-concession
  note: >-
    IRIS2 is procured rather than licensed: the anchoring instrument is a
    concession contract with the European Commission, not a spectrum
    authorisation. The ITU filings that will carry its spectrum are made by
    member state administrations and have not been identified. This is a
    genuinely different regulatory shape from every other record here and the
    `filing:` block is stretched to accommodate it.

