discrepancies:
- field: counts.announced
  claim: '282 satellites (264 LEO + 18 MEO)'
  claimed_by: york-ietf126
  registry_value: '290 (272 LEO + 18 MEO)'
  note: >-
    Both figures are in circulation and both are internally consistent. The
    difference is the "LEO Low" technology-incubation shell of ten or more
    satellites: 264 counts only the LEO High service shell, 272 includes the
    incubation satellites. Neither is wrong; they are counting different
    things. A small, tractable example of why a satellite count is meaningless
    without a stated scope.

notes: >-
  Provenance gap: no primary source. The concession contract itself, the
  Commission's programme documentation and the member state ITU filings that
  will carry the spectrum have none of them been consulted.
  IRIS2 is the registry's worked example of a system that does not fit the
  filing-centred model: it is a publicly procured programme whose defining
  instrument is a concession contract, whose spectrum will come through member
  state administrations, and whose satellite count is a design target rather
  than an authorised ceiling. Worth discussing whether the schema should carry
  a distinct instrument type for procured systems.
