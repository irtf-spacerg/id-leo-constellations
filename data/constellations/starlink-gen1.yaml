shells:
- label: gen1-s1
  status: deployed
  geometry_kind: walker
  altitude_km: 550
  inclination_deg: 53.0
  planes: 72
  sats_per_plane: 22
  satellites: 1584
  walker: D
  phasing: 39
  code: 'D:550:53.0:1584/72/39'
  code_status: assumed-phasing
  code_assumptions:
  - element: phasing
    value: 39
    basis: >-
      Not stated in FCC 21-48, which gives only altitude, inclination, plane
      count and satellites per plane. F=39 is the value in the example table
      of draft-piraux-space-constellation-code and in the LEO networking
      literature it draws on.
    src: piraux-code-draft
  - element: walker
    value: D
    basis: >-
      Inferred from a 53 deg inclination with uniform plane spacing. The
      filing does not use Walker terminology.
    src: fcc-gen1-2021
  code_src: piraux-code-draft
  src: fcc-gen1-2021
- label: gen1-s2
  status: deployed
  geometry_kind: walker
  altitude_km: 540
  inclination_deg: 53.2
  planes: 72
  sats_per_plane: 22
  satellites: 1584
  walker: D
  code_status: unknown
  code_note: >-
    Phasing factor not published, and no literature value to borrow as there
    is for gen1-s1. No code emitted rather than a guessed one.
  src: fcc-gen1-2021
- label: gen1-s3
  status: deployed
  geometry_kind: walker
  altitude_km: 570
  inclination_deg: 70.0
  planes: 36
  sats_per_plane: 20
  satellites: 720
  walker: D
  code_status: unknown
  src: fcc-gen1-2021
- label: gen1-s4
  status: deployed
  geometry_kind: walker
  altitude_km: 560
  inclination_deg: 97.6
  planes: 6
  sats_per_plane: 58
  satellites: 348
  walker: S
  code_status: unknown
  src: fcc-gen1-2021
- label: gen1-s5
  status: deployed
  geometry_kind: irregular
  altitude_km: 560
  inclination_deg: 97.6
  planes: 4
  sats_per_plane: 43
  satellites: 172
  walker: S
  code_status: not-representable
  code_note: >-
    Same altitude and inclination as gen1-s4. The two are distinct plane
    groups within one physical shell; the code can only express them as two
    "+"-joined shells, which loses the fact that they share a shell. 58 and 43
    satellites per plane in 6 and 4 planes respectively is also not a Walker
    pattern in any useful sense.
  src: fcc-gen1-2021

