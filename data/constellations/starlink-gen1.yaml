notes: >-
  The ITU networks behind Starlink are notified by Norway, not the United
  States. SpaceX holds a US licence from the FCC and the international filings
  that carry its spectrum are made by the Norwegian administration under the
  names STEAM-1, STEAM-2 and STEAM-2B. Nothing improper about that, and it is
  common practice, but it means a reader looking for Starlink under "USA" in
  ITU records will not find it, and any jurisdiction-by-jurisdiction tally
  built from ITU data will attribute the largest constellation in orbit to
  Norway. This is the single most consequential thing found in the ITU pass.
  Provenance gap: two later modifications (SAT-MOD-20230215-00036, granted
  2024-08-16, and SAT-MOD-20241104-00251, granted 2025-03-17) are recorded
  from a citation in DA 26-113 but have not been read. The authorised geometry
  may have changed since FCC 21-48, so the shells here are the 2021
  configuration and are marked as such by their src.
  counts.launched is deliberately empty on this record: launch reporting does
  not distinguish Gen1 from Gen2 spacecraft, so a per-authorisation launched
  figure cannot be sourced. The family-level figure is on starlink-gen2.
