isl: optical
isl_detail: >-
  Optical inter-satellite links are the system's primary communications path.
  Per the application, the links "will route traffic within the network and to
  satellites in the Starlink constellation, via its high capacity (petabit)
  and high reliability laser mesh, which in turn will transmit traffic to
  authorized earth stations on the ground". The system therefore depends on
  the Gen1 and Gen2 Starlink authorisations for its ground path, which is a
  coupling between three separate licences worth noting. The grant adds that
  any backup Ka-band contact is to go to gateways within the Gen1 and Gen2
  envelope.
spectrum:
- Ka
- optical
spectrum_detail: >-
  Ka-band 18.8-19.3 GHz (space-to-Earth) and 28.6-29.1 GHz (Earth-to-space)
  for backup and emergency TT&C only, on an unprotected and non-interference
  basis, under a waiver of the U.S. Table (DA 26-1273). SpaceX states it does
  not plan to use the Ka-band except for limited emergency operations;
  communications are optical.

