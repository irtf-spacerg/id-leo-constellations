regulatory:
- authority: FCC
  country: US
  kind: application
  file_number: SAT-LOA-20260108-00016
  call_sign: S00798
  action: pending
  date: 2026-01-30
  satellites: 1000000
  scope: >-
    Application for authority to launch and operate a new NGSO system of up to
    one million satellites, the "SpaceX Orbital Data Center system", at
    altitudes from 500 km to 2,000 km in 30 degree and sun-synchronous
    inclinations, within orbital shells spanning up to 50 km each. Different
    satellite hardware versions are planned across shells.
  src: fcc-odc-pn-2026
- authority: FCC
  country: US
  kind: public-notice
  file_number: SAT-LOA-20260108-00016
  document: DA 26-113
  action: pending
  date: 2026-02-04
  scope: >-
    Space Bureau accepts the application for filing and seeks comment.
  src: fcc-odc-pn-2026

shells:
- label: odc-band
  status: proposed
  geometry_kind: sso-band
  code_status: not-representable
  code_note: >-
    The application describes a *range*, not shells: altitudes from 500 km to
    2,000 km, inclinations of 30 degrees and sun-synchronous, within shells
    spanning up to 50 km each. No plane count, per-plane population or
    phasing. Sun-synchronous orbits additionally carry a local time of the
    ascending node, which the constellation code has no field for. Nothing
    here is expressible as a Walker triple, and a registry that invented one
    would be inventing the topology.
  src: fcc-odc-pn-2026

isl: optical
isl_detail: >-
  Optical inter-satellite links are the system's primary communications path.
  Per the application, the links "will route traffic within the network and to
  satellites in the Starlink constellation, via its high capacity (petabit)
  and high reliability laser mesh, which in turn will transmit traffic to
  authorized earth stations on the ground". The system therefore depends on
  the Gen1 and Gen2 Starlink authorisations for its ground path, which is a
  coupling between three separate licences worth noting.
spectrum:
- optical
spectrum_detail: >-
  Optical for user traffic; RF for telemetry, tracking and command only. The
  public notice does not state the TT&C bands.

