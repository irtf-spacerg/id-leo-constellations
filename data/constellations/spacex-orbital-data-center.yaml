status_detail: >-
  Authorised 25 November 2026 for 1,000,000 satellites (DA 26-1273, granted in
  part and deferred in part), on an application filed 30 January 2026. Nothing
  launched. The grant covers backup and emergency Ka-band TT&C only, and
  satellites above 600 km need a further modification application before they
  can be deployed. This single authorisation outweighs every other licence in
  the registry combined.
