discrepancies:
- field: counts.filed
  claim: '1,198,120 satellites planned'
  claimed_by: york-ietf126
  registry_value: '1,000,000 requested (application ceiling)'
  note: >-
    The application, as described in the FCC's own acceptance notice, is for
    "up to one million satellites". The 1,198,120 figure is Jonathan
    McDowell's, from his constellation list, as Dan York confirmed on
    29 July 2026. The registry could not locate that specific entry on the
    page on 30 July 2026 and so cannot say how the figure was derived; it may
    aggregate shells or filings that the FCC's summary rounds. This matters
    more than most discrepancies here because the application accounts for
    roughly half of the widely quoted 2.3 million aggregate, so a 198,120
    difference is about 8 per cent of the headline number. Resolving it
    properly needs the application's own Attachment A rather than either
    summary.

notes: >-
  Reported in the press as connected to the SpaceX/xAI merger. The application
  itself is for a communications authorisation; the compute payload is not
  what the FCC is licensing, which is worth remembering when reading the
  filing as evidence about data-centre capacity.
  Provenance gap: the application narrative and technical attachment
  (Attachment A) are cited in DA 26-113 but have not been read directly. They
  would give the shell structure, the satellite versions and the TT&C bands.
