  scope: >-
    Memorandum Opinion and Order and Authorization, by the Chief of the Space
    Bureau on delegated authority. Authorises backup and emergency TT&C (Space
    Operation Service) at 18.8-19.3 GHz (space-to-Earth) and 28.6-29.1 GHz
    (Earth-to-space), unprotected and non-interference, for a constellation of
    1,000,000 NGSO satellites in 50 km shells between 500 and 1,002 km at
    30-degree and sun-synchronous inclinations. Waives the processing round
    rules (25.156, 25.157), the surety bond (25.165) and the Schedule S limits
    (25.114(a)(1)), and on the Bureau's own motion the U.S. Table (2.106(a)).
    Replaces the part 25 milestones with the new part 100 schedule. Defers the
    request to dispose of satellites other than by atmospheric re-entry, and
    makes deployment above 600 km wait on a modification application with a
    final debris mitigation plan. Environmental and optical-astronomy
    objections are dismissed as outside the Commission's authority. Fifteen-
    year term from the first satellite in orbit; semi-annual reporting on
    conjunctions, re-entries and deployed satellites.
