discrepancies:
- field: counts.filed
  claim: '1,198,120 satellites planned'
  claimed_by: york-ietf126
  registry_value: '1,000,000 requested; 1,000,000 authorised 25 November 2026'
  note: >-
    The application, as described in the FCC's own acceptance notice, is for
    "up to one million satellites", and DA 26-1273 authorises exactly
    1,000,000. The 1,198,120 figure is Jonathan McDowell's, from his
    constellation list, as Dan York confirmed on 29 July 2026. The registry
    could not locate that specific entry on the page on 30 July 2026 and so
    cannot say how the figure was derived. The grant lists six nominal shells
    without per-shell counts, so it does not explain the difference either.
    This matters more than most discrepancies here because the application
    accounts for roughly half of the widely quoted 2.3 million aggregate, so a
    198,120 difference is about 8 per cent of the headline number.

notes: >-
  Reported in the press as connected to the SpaceX/xAI merger. The grant is a
  radio authorisation only: backup and emergency Ka-band TT&C in the Space
  Operation Service. The compute payload and the optical links that carry the
  system's traffic are outside what the FCC licenses, which is worth
  remembering when reading the grant as evidence about data-centre capacity.
  The grant applies the new part 100 deployment schedule (Space Modernization
  Report and Order, FCC 26-47) in place of the part 25 milestones, with the
  surety bond waived: one satellite by 25 November 2033, 10 per cent by 2035,
  half by 2038 and all by 2040, or the authorisation becomes void. SpaceX
  first asked to waive milestones altogether and withdrew that request on
  19 October 2026. The licensed count therefore carries milestones but no
  bond, and its first milestone is a single satellite seven years out.
  The order dates the application 30 January 2026 in the grant and 20 January
  2026 in a footnote; this record uses 30 January, which matches DA 26-113.
  Provenance gap: the application narrative, its Attachment A and SpaceX's
  letter of 29 May 2026 that gives the nominal shells have not been read.
