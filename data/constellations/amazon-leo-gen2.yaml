discrepancies:
- field: counts.licensed
  claim: 'Gen2: +4,500, approved Feb 10, 2026'
  claimed_by: york-ietf126
  registry_value: '4,504 across two systems: Gen2 3,212 and Polar 1,292'
  note: >-
    The family total on the slide (7,736) is right. The breakdown is not:
    the February 2026 grant covers two distinct systems with their own
    milestone schedule, not a single increment to Gen1. Widely rounded to
    "4,500" in the press. Splitting them matters because the Polar system is
    a different orbital regime serving a different coverage problem.

notes: >-
  Provenance gap: this record is built entirely from the description of the
  10 February 2026 grant contained in a *later* order (DA 26-553). The grant
  stamp itself, under ICFS SAT-LOA-20211104-00145 and SAT-AMD-20250311-00068,
  has not been read. Reading it would supply the orbital parameters for both
  the Gen2 and Polar systems, which are the main gap in this record.
  Note the source grading subtlety: DA 26-553 is a primary source, and it is
  a primary source *for what it says*, which is the counts and the milestone
  dates. It is not a source for the shell geometry, which it does not
  discuss. A source's grade does not extend beyond its contents.
