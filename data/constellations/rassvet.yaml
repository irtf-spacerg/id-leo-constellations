discrepancies:
- field: counts
  claim: '318 ... or ... 924 satellites planned'
  claimed_by: york-ietf126
  registry_value: '1,350 declared to the ITU; 292-383 in company and federal plans'
  note: >-
    The deck offers two figures without choosing, which is honest. The
    registry can now add a third that is documented: RASSVET-1's coordination
    request declares 1,350 satellites. It matches none of the circulating
    numbers, and it is larger than all of them, which is the usual direction.
- field: itu
  claim: 'Rassvet is scaling up; hundreds more ahead'
  claimed_by: wikipedia-bureau1440
  registry_value: >-
    Two of the three Rassvet ITU networks were suppressed in December 2025
  note: >-
    A finding that no secondary source in this registry mentions. On
    29 December 2025 the Russian administration suppressed both API/A and CR/C
    for RASSVET and for RASSVET-2, published in BR IFIC 3065 in February 2026,
    three weeks before the first production launch. Suppression is a
    deliberate act by the notifying administration, not an expiry. It may be
    consolidation onto RASSVET-1 rather than retreat, and this registry does
    not claim to know which. What it does record is that the ITU footprint of
    this system shrank from three networks to one at the moment the press
    narrative was about expansion.

notes: >-
  Provenance upgraded 2026-07-29 from encyclopaedia and press to the ITU
  filings and publication. See scripts/itu_query.sh.
  Reporting on this system is heavily coloured by the war in Ukraine and by
  its dual-use potential, in both directions. The ITU record is the one part
  of the picture that is neutral and checkable, which is most of why this
  round of work was worth doing.
