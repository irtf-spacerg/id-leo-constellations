status_detail: >-
  First 16 production satellites launched 23 March 2026 after an experimental
  phase from 2023. Of the three ITU networks filed in 2022-2023, two were
  suppressed at the operator's own administration's request in December 2025;
  only RASSVET-1 remains on file.
