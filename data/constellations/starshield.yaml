notes: >-
  Kept in the registry with almost every field empty on purpose. A government
  constellation of this size is a real consumer of orbital shells and spectrum
  and a real contributor to conjunction and coordination load, and omitting it
  because it is undocumented would understate the picture in exactly the
  direction that is hardest to notice. What the record contributes is the
  fact, stated in filing_absent, that no public filing exists.
  Possible future primary sources: the UN Register of Objects Launched into
  Outer Space (treaty-registry) gives launch-by-launch registrations with
  orbital parameters, and NTIA spectrum certification records are partially
  public. Neither has been checked.
