orbit_regimes:
- LEO
dual_use: military

filing_absent: >-
  No public FCC or ITU filing identifies this system. It is procured and
  operated under US government contracts, principally for the National
  Reconnaissance Office's proliferated architecture, and US federal government
  spectrum use is coordinated through NTIA rather than licensed by the FCC, so
  no ICFS docket exists to point at. Everything in this record therefore rests
  on launch reporting and catalogue observation. This is a structural
  provenance limit, not an oversight, and it applies to classified systems in
  every jurisdiction.

