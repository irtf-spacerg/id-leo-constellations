regulatory:
- authority: FCC
  country: US
  kind: application
  file_number: SAT-LOA-20260310-00118
  call_sign: S00830
  action: pending
  date: 2026-03-19
  satellites: 51600
  scope: >-
    Application for up to 51,600 satellites ("Project Sunrise") operating as a
    data centre in space, in circular sun-synchronous orbits between 500 km
    and 1,800 km, with approximately 300 to 1,000 satellites per orbital
    plane. TT&C requested at 18.8-19.3 GHz (space-to-Earth) and 28.6-29.1 GHz
    (Earth-to-space), with waivers of sections 25.155(b), 25.157(c), 25.164,
    25.165, 25.112(a) and 25.114(c).
  src: fcc-sunrise-pn-2026
- authority: FCC
  country: US
  kind: public-notice
  file_number: SAT-LOA-20260310-00118
  document: Report No. SAT-01992
  action: pending
  date: 2026-04-17
  scope: Space Bureau accepts the application for filing.
  src: fcc-sunrise-pn-2026
- authority: FCC
  country: US
  kind: comment
  action: pending
  date: 2026-05
  scope: >-
    NASA filed an objection to the application. The grounds have not been
    read; NASA objections to large constellations have historically concerned
    conjunction risk with science missions and with the ISS.
  src: satnews-nasa-sunrise-2026
- authority: FCC
  country: US
  kind: petition
  file_number: SAT-LOA-20260310-00118
  action: pending
  date: 2026-07-08
  scope: >-
    DarkSky International, Environment America and PEER petition the FCC to
    prepare a programmatic environmental impact statement under NEPA covering
    all pending orbital data centre applications (SpaceX, Starcloud, Blue
    Origin, Cowboy Space), and to pause licensing until it is complete. In the
    alternative the petition asks to be treated as a petition to deny each
    application under 47 CFR 1.1313(a).
  src: darksky-peis-petition-2026
- authority: FCC
  country: US
  kind: amendment
  file_number: SAT-LOA-20260310-00118
  call_sign: S00830
  action: pending
  date: 2026-09-18
  satellites: 51600
  scope: >-
    Replaces the dual-horn/omnidirectional antennas with high-gain directional
    parabolic antennas (0.85 m and 0.65 m reflectors) for TT&C and
    communications at 18.8-19.3 GHz and 28.6-29.1 GHz, with a revised
    Schedule S and a waiver request under 25.114(c). Constellation
    architecture, shells, planes, satellite count and payload are stated to
    be unchanged.
  src: bo-sunrise-amd-2026

shells:
- label: sso-500-1800
  status: proposed
  geometry_kind: sso-band
  max_sats_per_plane: 1000
  code_status: not-representable
  code_note: >-
    Sun-synchronous orbits from 500 to 1,800 km with 300 to 1,000 satellites
    per plane. Both the altitude and the per-plane population are ranges, so
    there is no (T, P, F) triple. Sun-synchronous orbits also carry a local
    time of the ascending node that the code cannot express. Note the
    per-plane figure: 1,000 satellites in a single plane is two orders of
    magnitude beyond anything in the operational shells in this registry, and
    worth flagging to anyone modelling intra-plane topology.
  src: fcc-sunrise-pn-2026

spectrum:
- Ka
- optical
spectrum_detail: >-
  Ka-band 18.8-19.3 GHz (space-to-Earth) and 28.6-29.1 GHz (Earth-to-space).
  The accepted-for-filing notice lists these bands for TT&C; the September
  2026 amendment describes them as carrying both TT&C and communications
  through the new directional antenna. Bulk user traffic is to travel by
  optical link into TeraWave.
isl: external
isl_detail: >-
  Optical links into Blue Origin's own TeraWave constellation, which has its
  own pending FCC application (SAT-LOA-20260120-00033) and no grant. The
  compute system's path to the ground therefore depends on a second
  authorisation that does not yet exist.

