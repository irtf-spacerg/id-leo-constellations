regulatory:
- authority: FCC
  country: US
  kind: application
  action: pending
  date: 2026-03-19
  satellites: 51600
  scope: >-
    Application for up to 51,600 orbital data centre satellites in
    sun-synchronous orbits between 500 km and 1,800 km, with between 300 and
    1,000 satellites per orbital plane. Ka-band requested for telemetry,
    tracking and command; user data to move over optical inter-satellite links
    into Blue Origin's TeraWave network and thence to the ground.
  src: geekwire-sunrise-2026
- authority: FCC
  country: US
  kind: application
  action: pending
  date: 2026-05
  scope: >-
    NASA filed an objection to the application. The grounds have not been
    read; NASA objections to large constellations have historically concerned
    conjunction risk with science missions and with the ISS.
  src: satnews-nasa-sunrise-2026

shells:
- label: sso-500-1800
  status: proposed
  geometry_kind: sso-band
  max_sats_per_plane: 1000
  code_status: not-representable
  code_note: >-
    Sun-synchronous orbits from 500 to 1,800 km with 300 to 1,000 satellites
    per plane. Both the altitude and the per-plane population are ranges, so
    there is no (T, P, F) triple. Sun-synchronous orbits also carry a local
    time of the ascending node that the code cannot express. Note the
    per-plane figure: 1,000 satellites in a single plane is two orders of
    magnitude beyond anything in the operational shells in this registry, and
    worth flagging to anyone modelling intra-plane topology.
  src: geekwire-sunrise-2026

spectrum:
- Ka
- optical
spectrum_detail: >-
  Ka-band for TT&C only. No service spectrum of its own; user traffic is to
  travel by optical link into TeraWave.
isl: external
isl_detail: >-
  Optical links into Blue Origin's own TeraWave constellation, which is itself
  only announced and has no filing reference in this registry. The compute
  system's path to the ground therefore depends on a system whose existence is
  not yet documented in a docket.

