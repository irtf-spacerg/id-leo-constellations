discrepancies:
- field: counts.filed
  claim: '51,600 planned; FCC filing Mar 19, 2026'
  claimed_by: york-ietf126
  registry_value: '51,600 requested; application pending'
  note: >-
    Count and date both agree with the reporting. The registry adds only that
    NASA has objected, which the deck does not mention and which is material
    to whether the filing becomes an authorisation.

notes: >-
  The filing anchor, count and orbits now rest on the FCC's accepted-for-filing
  notice and on the September 2026 amendment, both primary.
  Provenance gap: the original application narrative and Technical Annex have
  not been read; they would give the shell and plane structure behind the
  500-1,800 km range. NASA's objection has not been read either, and it would
  be the first documented instance in this registry of a federal science
  agency contesting a constellation filing on operational grounds. The
  amendment's own ICFS number is not printed on the document; an ICFS link
  found through a tracker gives SAT-AMD-20260917-00370, not confirmed here.
