discrepancies:
- field: counts.filed
  claim: '51,600 planned; FCC filing Mar 19, 2026'
  claimed_by: york-ietf126
  registry_value: '51,600 requested; application pending'
  note: >-
    Count and date both agree with the reporting. The registry adds only that
    NASA has objected, which the deck does not mention and which is material
    to whether the filing becomes an authorisation.

notes: >-
  Provenance gap: no primary source, and the ICFS file number has not been
  retrieved. Reading the application would give the shell structure, the
  satellite design and the basis for the 51,600 figure, and reading NASA's
  objection would give the first documented instance in this registry of a
  federal science agency contesting a constellation filing on operational
  grounds. Both are worth doing.
