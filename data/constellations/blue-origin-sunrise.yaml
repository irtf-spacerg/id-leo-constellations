status_detail: >-
  Application filed 19 March 2026, accepted for filing 17 April 2026, amended
  18 September 2026; no grant. NASA filed an objection in May 2026, and a
  July 2026 petition asks the FCC to pause all orbital data centre licensing.
  Nothing launched.
