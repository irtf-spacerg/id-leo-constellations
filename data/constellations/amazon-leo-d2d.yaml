notes: >-
  Contributed by Dan York on 29 July 2026, having been filed after his IETF
  126 survey was presented. The first entry in the registry to come from the
  community rather than the initial sweep.
  Provenance gap: no primary source. The ICFS file number, the orbital
  parameters and the exact band edges all need the application itself.
  This record and globalstar-c3 will need reconciling if the Amazon
  acquisition of Globalstar completes: two systems, one spectrum position, one
  eventual owner. Whether the D2D constellation supersedes the C-3 plan or
  runs alongside it is not yet stated anywhere this registry has found.
