  date: 2026-07-24
  satellites: 5105
  scope: >-
    Application for authority to launch and operate a non-geostationary
    system of 5,105 satellites providing mobile-satellite service, with an
    estimated operational lifetime of 7 years from launch. Schedule S states
    frequencies of 1427-2690 MHz in both directions, with the service
    described as SCS and flagged as non-conforming. Altitudes of 510 to 580
    km, the Globalstar L- and S-band allocations specifically, and services
    to unmodified 4G and 5G handsets no earlier than 2028 are press-reported
    and are not stated in Schedule S.
  src: fcc-sat-loa-20260601-00224

shells:
- label: d2d-510-580
  status: proposed
  geometry_kind: unknown
  code_status: unknown
  code_note: >-
    Schedule S declares one orbital plane and one simultaneously operating
    satellite for a 5,105-satellite system, so those fields carry no usable
    geometry. The parameters are in a separate attachment, "Amazon Leo D2D
    Application - Orbital Parameters Attachment.zip", which has not been
    opened. The 510-580 km altitude range is press-reported. No inclination,
    plane count or per-plane population is traced to the filing.
  src: fcc-sat-loa-20260601-00224

spectrum:
- L
- S
spectrum_detail: >-
  Schedule S states a single band pair, 1427-2690 MHz, in both directions,
  which spans the L- and S-band allocations Globalstar holds. The filing
  describes the service as SCS and flags it as non-conforming. This is the
  first record in the registry where the spectrum rationale is an
  acquisition and not a processing round: Amazon is buying the spectrum
  position along with the operator that holds it.
isl: unknown

