    per-plane population traced; the application would give them.
  src: viasat-amazon-d2d-2026

spectrum:
- L
- S
spectrum_detail: >-
  Globalstar's existing L-band (around 1.6 GHz) and S-band (around 2.4 GHz)
  allocations. This is the first record in the registry where the spectrum
  rationale is an acquisition rather than a processing round: Amazon is
  buying the spectrum position along with the operator that holds it.
