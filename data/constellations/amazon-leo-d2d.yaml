status_detail: >-
  Application filed with the FCC on 24 July 2026 for up to 5,105 satellites,
  using the L- and S-band spectrum held by Globalstar, whose acquisition by
  Amazon was announced in April 2026 and is expected to close in 2027. No
  grant. Service stated as no earlier than 2028.
