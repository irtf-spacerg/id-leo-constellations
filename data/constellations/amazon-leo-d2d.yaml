regulatory:
- authority: FCC
  country: US
  kind: application
  action: pending
  date: 2026-07-24
  satellites: 5105
  scope: >-
    Application for authority to deploy up to 5,105 LEO satellites between
    510 and 580 km, with operational lifetimes of about 6 to 8 years, using
    Globalstar's existing L-band (around 1.6 GHz) and S-band (around 2.4 GHz)
    allocations. Services stated as voice, messaging, mobile broadband,
    emergency calling and IoT including fleet tracking, to unmodified 4G and
    5G handsets, no earlier than 2028.
  src: viasat-amazon-d2d-2026

