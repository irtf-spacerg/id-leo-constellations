notes: >-
  Contributed by Dan York on 29 July 2026, having been filed after his IETF
  126 survey was presented. The first entry in the registry to come from the
  community rather than the initial sweep, and the first whose provenance was
  upgraded by a contributor: Dan supplied the ICFS file number on 3 August
  2026, and the count, the band edges and the lifetime now come from
  Schedule S instead of trade press.
  Provenance gap: the orbital geometry is in an attachment,
  "Amazon Leo D2D Application - Orbital Parameters Attachment.zip", which has
  not been opened, and the public version of Exhibit C (technical attachment
  and ODAR) has not been read. A confidential version of Exhibit C is
  withheld, so some technical detail will not become public.
  This record and globalstar-c3 will need reconciling if the Amazon
  acquisition of Globalstar completes: two systems, one spectrum position, one
  eventual owner. Whether the D2D constellation supersedes the C-3 plan or
  runs alongside it is not yet stated anywhere this registry has found.
