  - Arianespace
  - Blue Origin
  - SpaceX
  cadence: >-
    Amazon contracted the largest commercial launch procurement on record
    across every provider except SpaceX, which was added later, but the
    vehicles have not flown at the rate the milestones assume. This is the
    proximate cause of the June 2026 waiver and the clearest case in the
    registry of launch capacity, not capital or licensing, being the binding
    constraint.
  src: york-ietf126

