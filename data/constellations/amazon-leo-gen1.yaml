  document: DA 26-553
  action: granted-in-part
  date: 2026-06-05
  scope: >-
    Amazon Leo applied on 30 January 2026 to extend the interim milestone by
    24 months or, alternatively, to waive it. The Space Bureau granted a
    limited waiver with conditions: it waived the section 25.161(a)(2)
    automatic-termination cap and part of section 25.164(b)(2), while
    temporarily demoting the spectral priority of satellites launched after
    the July 2026 milestone date until the build rate improves. The 100 per
    cent milestone of 30 July 2029 was not disturbed and the surety bond
    obligation was not waived.
  src: fcc-kuiper-waiver-2026

