discrepancies:
- field: counts.licensed
  claim: 'Gen1: 3,236, 2020'
  claimed_by: york-ietf126
  registry_value: '3,232 licensed (reduced from 3,236 in 2024); 3,236 filed'
  note: >-
    A four-satellite difference that matters only as a demonstration: the
    authorised figure moved in 2024 and the commonly cited one did not.
- field: regulatory.milestones
  claim: 'Gen1 50% deadline waived Jun 2026'
  claimed_by: york-ietf126
  registry_value: >-
    Limited waiver with conditions; spectral priority of post-milestone
    satellites temporarily demoted; surety bond obligation not waived
  note: >-
    Reported variously as a clean waiver and as an extension to July 2027 or
    July 2028. DA 26-553 grants neither: it waives specific provisions while
    imposing spectrum-priority conditions designed to keep pressure on the
    build rate. Press figures of "1,618 satellites by July 2026" are also
    wrong; the order says 1,616.

notes: >-
  Amazon renamed Project Kuiper to Amazon Leo in 2026 and the FCC order adopts
  the new name for both constellation and licensee, while the licensee of
  record remains Kuiper Systems LLC.
  Provenance gap: FCC 20-102 is cited through the fcc.report mirror of the
  grant attachment rather than a docs.fcc.gov permanent URL, and the 2024
  orbital parameters modification (39 FCC Rcd 2180) has not been read. The
  shells recorded here are the 2020 configuration, so the current authorised
  geometry may differ. This is why each shell carries its own src.
