discrepancies:
- field: counts.licensed
  claim: '~100 satellites planned'
  claimed_by: york-ietf126
  registry_value: '248 licensed'
  note: >-
    The largest proportional gap found so far, and in the opposite direction
    to most: the deck understates by roughly a factor of two and a half. The
    248-satellite authorisation was granted on 21 April 2026, three months
    before the talk. The "~100" figure appears to predate it.

notes: >-
  This record is the registry's worked example of orbital geometry that the
  constellation code cannot express for a reason unrelated to phasing: every
  authorised shell here is elliptical, with apogee and perigee stated
  separately and a station-keeping tolerance attached. The code assumes a
  single circular altitude. Four of the five shells also fail the code's
  divisibility or plane-count assumptions independently.
  AST's satellites are physically very large, which is why the constellation
  size is small relative to its coverage ambition. Recording sat_mass_kg for
  this system would be valuable and has not been done.
