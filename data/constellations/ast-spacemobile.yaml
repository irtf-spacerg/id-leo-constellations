spectrum_detail: >-
  V-band feeder links and TT&C in 37.5-42.0 GHz (space-to-Earth), 47.2-50.2
  and 50.4-51.4 GHz (Earth-to-space) under the August 2024 grant. Service
  links are supplemental coverage from space using terrestrial cellular
  spectrum leased from AT&T and Verizon, plus FirstNet spectrum by agreement;
  the leases were granted the same day as DA 26-391.
