shells:
- label: bb1-520
  status: deployed
  geometry_kind: irregular
  planes: 1
  sats_per_plane: 5
  satellites: 5
  inclination_deg: 53.0
  code_status: not-representable
  code_note: >-
    The authorisation specifies an apogee of 520 km (+/- 30 km) and a perigee
    of 515 km (+/- 30 km), with operations permitted down to 425 km. The
    constellation code carries a single circular altitude and has no field for
    apogee, perigee or a station-keeping tolerance, so the authorised orbit
    cannot be expressed without discarding information.
  src: fcc-ast-2026
- label: bb2-520-6planes
  status: authorised
  geometry_kind: irregular
  planes: 6
  sats_per_plane: 4
  inclination_deg: 53.0
  code_status: not-representable
  code_note: >-
    22 satellites in 6 planes: not evenly divisible, so the code's requirement
    that satellites be divisible by planes cannot be met. Apogee 520 km,
    perigee 515 km. sats_per_plane recorded as the floor; the grant does not
    state the distribution.
  src: fcc-ast-2026
- label: fm2-460
  status: authorised
  geometry_kind: irregular
  satellites: 1
  inclination_deg: 50.0
  code_status: not-representable
  code_note: >-
    A single satellite at apogee and perigee 460 km (+/- 30 km), inclination
    50 deg, under its own modification (SAT-MOD-20251205-00370).
  src: fcc-ast-2026
- label: main-690-685
  status: authorised
  geometry_kind: irregular
  satellites: 192
  inclination_deg: 53.0
  code_status: not-representable
  code_note: >-
    192 satellites "operating each in 1 plane" at an apogee of 690 km and a
    perigee of 685 km, inclination 53 deg, deployed at 530 km and raised. One
    satellite per plane is a degenerate Walker configuration, and the orbit is
    elliptical. Neither is expressible.
  src: fcc-ast-2026
- label: polar-685-680
  status: authorised
  geometry_kind: irregular
  planes: 2
  satellites: 28
  sats_per_plane: 14
  inclination_deg: 98.1318
  code_status: not-representable
  code_note: >-
    28 satellites in 2 planes at apogee 685 km, perigee 680 km, inclination
    98.1318 deg. Elliptical, and the inclination is specified to four decimal
    places, which the code's float syntax can carry but which no other record
    in this registry needs.
  src: fcc-ast-2026

spectrum:
- V
