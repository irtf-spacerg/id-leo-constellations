discrepancies:
- field: counts.licensed
  claim: '34,864 satellites planned (Starlink)'
  claimed_by: york-ietf126
  registry_value: >-
    Gen1 4,408 licensed; Gen2 15,000 licensed of 29,988 filed. Family totals:
    19,408 licensed, 34,396 filed.
  note: >-
    The slide aggregates the Gen1 authorisation with the full Gen2 *request*
    rather than the Gen2 grant, and presents the result in a column labelled
    "satellites planned". 4,408 + 29,988 = 34,396, which is 468 short of the
    slide figure; the residual is unexplained. As of DA 26-36 the FCC has
    authorised 15,000 Gen2 satellites and expressly deferred action on the
    remaining 14,988.

notes: >-
  The ITU networks behind Starlink (STEAM-1, STEAM-2, STEAM-2B) are notified
  by Norway, not the United States; the shells declared in the most recent
  STEAM-2 notification match the Gen1 authorisation rather than this one, so
  the ITU detail is recorded on starlink-gen1. No ITU network has yet been
  identified that corresponds specifically to the Gen2 authorisation, which is
  itself worth resolving.
  This record is the registry's worked example of an envelope authorisation.
  Three of its four shell entries are geometry_kind envelope or unknown and
  emit no constellation code, because DA 26-36 bounds the geometry rather than
  fixing it and lets SpaceX redistribute satellites between shells. Any
  simulator that wants a concrete Gen2 topology must choose one point in that
  feasible set, and should say which.
