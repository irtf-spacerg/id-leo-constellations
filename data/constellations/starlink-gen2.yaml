- V
- W
spectrum_detail: >-
  Ku-, Ka-, V- and W-band per DA 26-36, plus 1980-2000 MHz and 2000-2020 MHz
  (Earth-to-space) and 2180-2200 MHz (space-to-Earth) outside the United
  States for up to 7,500 satellites. Requests for 20.2-21.2 GHz and
  30.0-31.0 GHz were deferred.
isl: optical
isl_detail: >-
  Optical inter-satellite links on all Gen2 satellites, forming the laser mesh
  that DA 26-113 describes as petabit-capacity. Not specified in the grant.

