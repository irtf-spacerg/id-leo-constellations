shells:
- label: gen2-first-grant
  status: superseded
  geometry_kind: irregular
  code_status: not-representable
  code_note: >-
    The December 2022 partial grant authorised 7,500 satellites across three
    shells at 525 km / 53 deg, 530 km / 43 deg and 535 km / 33 deg without
    stating a plane count or per-plane population, so no (T, P, F) triple
    exists. DA 26-36 subsequently authorised lowering these satellites into
    the 475-485 km shells.
  src: fcc-gen2-2022
- label: gen2-lower-72x144
  status: authorised
  geometry_kind: envelope
  max_planes: 72
  max_sats_per_plane: 144
  code_status: not-representable
  code_note: >-
    Applies to the shells centred at 340 km / 53 deg, 345 km / 48 deg,
    350 km / 38 deg, 355 km / 43 deg and 365 km / 28 or 32 deg. DA 26-36
    authorises up to 72 planes per shell with up to 144 satellites per plane,
    and separately permits SpaceX to "deploy satellites flexibly across
    authorized orbital shells to meet customer demands". There is no single
    (T, P, F) triple for any of these shells, and no fixed allocation of the
    15,000 satellites among them: the licence describes a feasible set.
  src: fcc-gen2-2026
- label: gen2-mid-56x120
  status: authorised
  geometry_kind: envelope
  max_planes: 56
  max_sats_per_plane: 120
  code_status: not-representable
  code_note: >-
    Applies to the shells centred at 480 km / 53 deg and 485 km / 43 deg.
    Up to 56 planes per shell with up to 120 satellites per plane.
  src: fcc-gen2-2026
- label: gen2-other-authorised
  status: authorised
  geometry_kind: unknown
  code_status: not-representable
  code_note: >-
    DA 26-36 also authorises shells at 360 km / 96.9 deg and 475 km / 28 or
    32 deg, and continued operation at 525 km / 53 deg, 530 km / 43 deg and
    535 km / 33 deg pending lowering. The order's plane/per-plane footnote
    does not cover these, so even the envelope is unstated. The 365 km and
    475 km inclinations are themselves conditional: 32 deg if the FAA permits
    Starship launches from Boca Chica at that inclination, 28 deg otherwise.
  src: fcc-gen2-2026

spectrum:
- Ku
