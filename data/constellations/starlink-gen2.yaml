    Authorisation and Order on the Gen2 upgrade modification and amendment
    (SAT-MOD-20241011-00224, SAT-AMD-20241017-00228). Authorises a second
    tranche of 7,500 satellites for a total of 15,000; upgrades the satellite
    form factor; adds Ku-, Ka-, V- and W-band frequencies and MSS as well as
    FSS in certain bands; adds orbital shells and lowers the satellites at
    525, 530 and 535 km into new shells; permits flexible deployment across
    authorised shells. Requests for MSS outside the US in 1429-2690 MHz and
    for 20.2-21.2 and 30.0-31.0 GHz, and for satellites beyond 15,000, are
    deferred.
