discrepancies:
- field: counts.filed
  claim: '13,952 satellites planned (Guowang, both sub-constellations)'
  claimed_by: york-ietf126
  registry_value: '6,080 declared for GW-A59; see guowang-gw-2 for the other'
  note: >-
    Guowang is two separate ITU networks, GW-A59 and GW-2, and this registry
    gives them a record each because they are separately filed and are at
    different stages. The 6,080 figure for GW-A59 is confirmed from the ITU
    publication. The commonly quoted 12,992 total and the deck's 13,952 differ
    by 960; neither can be reconciled until GW-2's coordination request is
    read, and that publication is outside the downloadable BR IFIC window.

notes: >-
