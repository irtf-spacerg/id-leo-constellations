status_detail: >-
  The lower of Guowang's two ITU networks. Coordination request on file and
  modified three times, most recently published in BR IFIC 3055 in September
  2025. No notification (Part I-S) has been filed for this network, so nothing
  under it has been brought into use in the ITU sense.
