notes: >-
  Split from globalstar-c3 so that the operational system and the planned
  next-generation system are not conflated: they have different satellite
  counts, different licensing administrations and different regulatory
  states. The deck's "~85 planned / 97 launched" belongs here and its
  "1,946 (C-3) / 0" belongs on globalstar-c3.
  Provenance gap: no file numbers for either the HIBLEO-4 licence or the
  HIBLEO-X market access grant, and no orbital parameters. Exhibit A to the
  Amazon transfer application lists every Globalstar authorisation and would
  close most of this in one read.
  If the Amazon transaction completes, this system and Amazon Leo come under
  one owner, alongside Amazon's stated intention to file for a global
  direct-to-device system. Worth tracking as a concentration question rather
  than only a technical one.
