status_detail: >-
  Advance publication information received by the ITU on 8 September 2023 and
  published 31 October 2023, with comments (API/B) published April 2024. No
  coordination request has been filed. Nothing launched. The third Chinese
  constellation of more than 10,000 satellites to be filed, after Guowang and
  Qianfan.
