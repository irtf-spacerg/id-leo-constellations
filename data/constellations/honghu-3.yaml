discrepancies:
- field: itu.date
  claim: 'filed a notification with the ITU on May 24 [2024]'
  claimed_by: spacenews-honghu-2024
  registry_value: 'API/A received 8 September 2023, published 31 October 2023'
  note: >-
    The ITU record does not support the May 2024 filing date that has followed
    this system through every subsequent write-up. What happened in April 2024
    was the publication of API/B, the comments stage. The filing itself is
    eight months older. The characterisation as a "notification" is also
    wrong: no notification exists, only advance publication information, which
    is the weakest stage.
- field: name
  claim: 'Hanwha (~10,000)'
  claimed_by: spacerg-minutes-126
  registry_value: 'Honghu-3 (China, 10,000), operator Hongqing Technology'
  note: >-
    Not a discrepancy in the deck, which has the name right, but in the SPACE
    RG session minutes. The raw notes record "Hanwha 3 (China, 10,000)" and
    the compiled minutes carry it forward as "Hanwha (~10,000)", dropping the
    country. Hanwha is a South Korean group with no constellation of this
    size; the system meant is Honghu-3. The minutes should be corrected.
    Recorded here because a registry of this kind is exactly where such an
    error should surface, and because it illustrates how a name mangled once
    in a transcript propagates into every downstream summary.

notes: >-
  Provenance partially upgraded 2026-07-29: the ITU filing identity, stage and
  dates now come from the Space Network List. The declared satellite count
  does not, because it lives in BR IFIC 3008 (October 2023), which is outside
  the roughly eighteen-month window in which BR IFICs can be downloaded
  without a subscription. Closing that needs the BR IFIC DVD-ROM or a TIES
  account. This is the clearest instance in the registry of the retention
  window blocking an otherwise easy provenance upgrade.
