  src: telesat-20f-2023
  note: >-
    The Canadian authorisation is referenced in Telesat's own annual report
    but its docket identifier has not been retrieved, and ISED does not
    publish satellite authorisations in a searchable docket comparable to the
    FCC's ICFS. The FCC market access grant is a separate act and is recorded
    under regulatory: below.

