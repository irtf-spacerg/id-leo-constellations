status: licensed
status_detail: >-
  Authorised by ISED in Canada, with US market access granted separately by
  the FCC. 198 satellites contracted from MDA in August 2023, down from an
  earlier 298. Telesat has stated it will not meet the current ISED milestones
  and intends to seek an amendment. Nothing launched.
