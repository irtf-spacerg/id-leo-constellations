discrepancies:
- field: counts.announced
  claim: '198? 300? 1,600?'
  claimed_by: york-ietf126
  registry_value: '198 contracted (2023); no authorised figure retrieved'
  note: >-
    The deck records three candidate figures with question marks, which is an
    honest way to present an unresolved number and worth saying so. This
    registry can partly resolve it: 198 is the number contracted from MDA in
    August 2023, down from an earlier plan of 298 (probably the "300"). The
    1,600 appears to be a much earlier ambition. What none of these is, yet,
    is an authorised figure.

notes: >-
  Provenance gap: this record has no usable primary source for its counts. The
  FCC market access grant is cited by landing page rather than by document
  number and has not been read, and the ISED authorisation has not been
  located at all.
  This record is the registry's worked example of the non-US-but-Western
  jurisdiction problem, which sits between the FCC case and the Chinese case:
  the authorisation certainly exists and is not secret, but it is not
  published in a form that can be cited, so the best available evidence is the
  operator's own reporting. Any contributor with ISED experience could close
  this quickly.
