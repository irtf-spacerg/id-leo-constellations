discrepancies:
- field: counts
  claim: '13,952 satellites planned (Guowang)'
  claimed_by: york-ietf126
  registry_value: >-
    GW-2: 1,728 notified, 6,912 in the coordination request. GW-A59: 6,080.
  note: >-
    The interesting number here is not the disagreement with the deck but the
    gap inside the ITU process itself. GW-2's coordination request covers a
    reported 6,912 satellites; its notification, filed five years later,
    declares 1,728. The same administration, the same network, a quarter of
    the satellites. Coordination requests stake out spectrum; notifications
    record what is actually to be operated. Treating the two as the same
    quantity, which every aggregate figure in circulation does, overstates by
    a factor of four on this network alone.

notes: >-
  Provenance upgraded 2026-07-29 from trade press to the ITU filing and
  publication. See scripts/itu_query.sh.
  Provenance gap: the CR/C figure of 6,912 could not be confirmed. Its
  publication, BR IFIC 2996 of May 2023, is outside the roughly eighteen-month
  window in which BR IFICs are downloadable without a subscription. Closing it
  needs the BR IFIC DVD-ROM or a TIES account.
